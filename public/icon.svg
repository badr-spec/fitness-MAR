<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep luxury emerald with dark navy undertones -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradient for Emblem Accents & Moroccan Star -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Vibrant Mint Gradient for Dynamic Swoosh -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base (Compliant with Android & iOS safe zone) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="220" r="220" fill="url(#emeraldGlow)" />

  <!-- Outer Geometric Moroccan Ring Pattern (Subtle Watermark) -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Dynamic Dumbbell Core & Fitness Wings -->
  <g filter="url(#shadow)">
    <!-- Central Dumbbell Bar (Angled 35deg for dynamic sports energy) -->
    <g transform="rotate(-30 256 240)">
      <!-- Left Weight Plates -->
      <rect x="135" y="210" width="18" height="60" rx="6" fill="url(#mintGrad)" />
      <rect x="157" y="195" width="22" height="90" rx="8" fill="url(#mintGrad)" />
      <rect x="183" y="180" width="24" height="120" rx="9" fill="#ecfdf5" />

      <!-- Center Bar with Grip Texture -->
      <rect x="207" y="230" width="98" height="20" rx="6" fill="#f8fafc" />
      <line x1="230" y1="230" x2="230" y2="250" stroke="#047857" stroke-width="3" />
      <line x1="243" y1="230" x2="243" y2="250" stroke="#047857" stroke-width="3" />
      <line x1="256" y1="230" x2="256" y2="250" stroke="#047857" stroke-width="3" />
      <line x1="269" y1="230" x2="269" y2="250" stroke="#047857" stroke-width="3" />
      <line x1="282" y1="230" x2="282" y2="250" stroke="#047857" stroke-width="3" />

      <!-- Right Weight Plates -->
      <rect x="305" y="180" width="24" height="120" rx="9" fill="#ecfdf5" />
      <rect x="333" y="195" width="22" height="90" rx="8" fill="url(#mintGrad)" />
      <rect x="359" y="210" width="18" height="60" rx="6" fill="url(#mintGrad)" />
    </g>
  </g>

  <!-- Crown Star (Moroccan Royal 5-pointed Star Symbol in Gold) -->
  <g transform="translate(256, 125) scale(0.9)" filter="url(#glowFilter)">
    <polygon points="0,-32 9,-10 32,-10 14,4 20,27 0,13 -20,27 -14,4 -32,-10 -9,-10"
             fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5" />
  </g>

  <!-- Dynamic Energy Swoosh (Flame / Agility Arc) -->
  <path d="M 120 320 C 180 395, 332 395, 392 320 C 352 355, 200 370, 120 320 Z" 
        fill="url(#goldGrad)" opacity="0.9" />

  <!-- App Title Typography embedded cleanly for App Stores & Standalone Splash -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="2"
        fill="#ffffff">FIT<tspan fill="#34d399">MAGHRIB</tspan></text>
  
  <text x="256" y="450" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="5"
        fill="url(#goldGrad)">SPORT &amp; DIET PRO</text>
</svg>
